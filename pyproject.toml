[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "matplotlib-rs"
version = "0.1.0"
description = "matplotlib reimplemented in Rust: pixel-identical output, much faster, drop-in pyplot API"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23"]
license = { text = "PSF-2.0" }

[tool.maturin]
python-source = "python"
module-name = "matplotlib_rs._mplrs"
features = ["pyo3/extension-module"]
