name: Publish PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published GitHub release tag, e.g. v0.0.2'
        required: true
        type: string
      dry_run:
        description: 'Validate distributions without uploading to PyPI'
        required: true
        default: false
        type: boolean
  workflow_run:
    workflows: ['Release']
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: pypi-${{ inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test publication checks
        run: python -m unittest discover -s scripts/tests
      - name: Download only verified packages from a tested GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/prepare_pypi_release.py --repository "$RELEASE_REPOSITORY" --tag "$RELEASE_TAG" --output pypi-dist --report pypi-verification.json
      - name: Validate package metadata and README for PyPI
        run: |
          python -m pip install 'twine==7.0.0'
          python -m twine check --strict pypi-dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: pypi-dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-verification
          path: pypi-verification.json
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_run' || !inputs.dry_run
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/matplotlib-rs/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist
      - name: Publish verified distributions with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
