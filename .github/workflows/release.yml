name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require matching package, lockfile, tag and release notes
        run: python scripts/check_version.py --tag "$GITHUB_REF_NAME"

  test:
    needs: validate
    uses: ./.github/workflows/ci.yml

  wheels:
    needs: validate
    name: Wheel Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build portable Linux x86_64 wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: x86_64
          manylinux: '2_28'
          args: --release --locked --out dist --interpreter python${{ matrix.python }}
      - name: Install and test wheel with NumPy as its only dependency
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip list
          version="${GITHUB_REF_NAME#v}"
          env -u PYTHONPATH "$RUNNER_TEMP/wheel-smoke/bin/python" scripts/smoke_wheel.py "$version" --output "$RUNNER_TEMP/smoke-output"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-py${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build source distribution
        run: |
          python -m pip install 'maturin==1.15.0'
          maturin sdist --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  performance:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: performance
      - name: Build authentic 0.0.1 baseline and current extension
        shell: bash
        run: |
          python -m pip install -r requirements-ci.txt
          mkdir -p "$RUNNER_TEMP/baseline-source" "$RUNNER_TEMP/baseline-wheel"
          git archive v0.0.1 | tar -x -C "$RUNNER_TEMP/baseline-source"
          (
            cd "$RUNNER_TEMP/baseline-source"
            maturin build --release --locked --interpreter python --out "$RUNNER_TEMP/baseline-wheel"
          )
          sh scripts/dev_build.sh --locked
      - name: Require identical 5,400-boxplot output and at least 10x faster build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p tests/output/release-performance
          python -u tests/bench/boxplot_build_compare.py --baseline-wheel "$RUNNER_TEMP"/baseline-wheel/*.whl --output tests/output/release-performance --rounds 5 --min-speedup 10 | tee tests/output/release-performance/run.log
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-performance
          path: |
            tests/output/release-performance/results.json
            tests/output/release-performance/*.log
            tests/output/release-performance/before.png
            tests/output/release-performance/after.png
          if-no-files-found: warn

  publish:
    needs: [test, wheels, sdist, performance]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-performance
          path: evidence
      - name: Package benchmark evidence and checksums
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          tar -czf "dist/matplotlib-rs-${version}-performance.tar.gz" -C evidence .
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Publish GitHub release after all gates pass
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" --notes-file "docs/releases/${version}.md"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
